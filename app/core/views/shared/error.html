<div class="col-12">
  <div class="card">
    <div class="card-body empty-state">
      <div class="empty-state-icon" style="background:var(--danger-soft);color:var(--danger);"><i class="fas fa-exclamation-triangle"></i></div>
      <h6>{{ heading }}</h6>
      <p>{{ message }}</p>
      <div class="d-flex justify-content-center flex-wrap" style="gap:8px;">
        <a v-if="showConnections" href="/database/connections" class="btn btn-primary"><i class="fas fa-list mr-1"></i> Manage Connections</a>
        <a href="javascript:history.back()" class="btn btn-secondary">Go back</a>
      </div>
    </div>
  </div>
</div>
