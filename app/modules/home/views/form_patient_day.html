<div class="col-sm-6">
  <div class="card" id="app">
    <div class="card-header" style="display:flex;align-items:center;gap:8px;">
      <i class="fas fa-hospital-user" style="color:#2563eb;"></i>
      <span>Criteria</span>
    </div>
    <div class="card-body">
      <form method="post" v-bind:action="patientReportOptions[0].value">
        <div class="form-group">
          <label>Month Year:</label>
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <i class="far fa-calendar-alt"></i>
              </span>
            </div>
            <input autocomplete="off" name="monthyear" type="text" class="form-control float-right datepickermy" required>
          </div>
        </div>

        <div class="form-group">
          <label>Select Report:</label>
          <select class="form-control" v-on:change="targetReport($event)">
            <option v-for="option in patientReportOptions" v-bind:value="option.value">{{ option.text }}</option>
          </select>
        </div>

        <div class="form-group mb-0">
          <div class="input-group">
            <button type="submit" class="btn btn-success float-right btn-block"><i class="fas fa-file-export"></i> <b>Export Data To Excel</b></button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
