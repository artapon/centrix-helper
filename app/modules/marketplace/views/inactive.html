<div class="col-12">
  <div class="card mk-inactive">
    <div class="card-body">
      <span class="mk-inactive-icon"><i :class="addon.icon"></i></span>
      <h2>{{ addon.name }} is not active</h2>
      <p v-if="addon.summary" class="text-muted">{{ addon.summary }}</p>
      <p v-if="isAdmin">An administrator has deactivated this add-on. You can activate it again in Marketplace.</p>
      <p v-else>An administrator has deactivated this add-on. Ask an administrator if you need it.</p>
      <a v-if="isAdmin" class="btn btn-primary" :href="marketplace + '#addon-' + addon.id"><i class="fas fa-store mr-1"></i> Open Marketplace</a>
      <a v-else class="btn btn-light" href="/"><i class="fas fa-home mr-1"></i> Home</a>
    </div>
  </div>
</div>

<style>
  .mk-inactive { max-width: 560px; margin: 40px auto; text-align: center; }
  .mk-inactive .card-body { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 32px 24px; }
  .mk-inactive h2 { font-size: 1.2rem; margin: 8px 0 4px; text-wrap: balance; }
  .mk-inactive p { margin: 0 0 8px; }
  .mk-inactive-icon { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font-size: 1.4rem; }
</style>
