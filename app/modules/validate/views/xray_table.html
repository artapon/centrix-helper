<div class="col-sm-12">
  <div class="card">
    <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:8px;">
        <i class="fas fa-x-ray" style="color:#2563eb;"></i>
        X-Ray Master
      </span>
      <a href="/radiology/default-modality/export" class="btn btn-success btn-sm"><i class="fas fa-download mr-1"></i> ดาวน์โหลด</a>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="border:none;border-radius:0 0 14px 14px;">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>code</th>
              <th>name</th>
              <th>description</th>
              <th>modality code</th>
              <th>modality name</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in xrays">
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.description }}</td>
              <td>{{ item.valuecode }}</td>
              <td>{{ item.valuedescription }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
